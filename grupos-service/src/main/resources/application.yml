server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: grupos-service

  # ---------- Base de datos (PostgreSQL) ----------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/grupos_db}
    username: ${SPRING_DATASOURCE_USERNAME:campus}
    password: ${SPRING_DATASOURCE_PASSWORD:campus123}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  # ---------- JSON: snake_case en todo, sin tocar cada DTO ----------
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

# ---------- Configuración propia ----------
app:
  jwt:
    secret: ${APP_JWT_SECRET}
  clients:
    materias-url: ${MATERIAS_URL:http://localhost:8006}
    timeout-ms: 3000

logging:
  level:
    com.campusstudy.grupos: INFO